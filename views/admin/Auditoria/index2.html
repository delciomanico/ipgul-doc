{{>_dash}}

<style>
    :root {
        --primary-color: #FF7C38 ;
        --primary-hover: #f59d6e;
    }
    
    .bg-custom {
        background-color: var(--primary-color);
    }
    
    .btn-custom {
        background-color: var(--primary-color);
        color: white;
    }
    
    .btn-custom:hover {
        background-color: var(--primary-hover);
        color: white;
    }
    
    .form-control:focus, .form-select:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 0.25rem rgba(255, 140, 0, 0.25);
    }
    
    .upload-area {
        border: 2px dashed var(--primary-color);
        border-radius: 5px;
        padding: 20px;
        text-align: center;
        background-color: rgba(255, 140, 0, 0.1);
        cursor: pointer;
    }
    
    .upload-area:hover {
        background-color: rgba(255, 140, 0, 0.2);
    }
    
    .upload-icon {
        font-size: 3rem;
        color: var(--primary-color);
    }
    
    .document-icon {
        font-size: 1.5rem;
        color: var(--primary-color);
    }
    
    .table-hover tbody tr:hover {
        background-color: rgba(255, 140, 0, 0.1);
    }
    </style>

<div class="container-fluid py-4">
    <h2 class="mb-4 text-center">Notificações</h2>

    {{>_msgHome}}
    
 <!-- Search Filters -->
 <div class="card  shadow-sm">
    <div class="card-body">
        <form id="searchForm">
            <div class="row g-3 ">
                <div class="col-md-3">
                    <label class="form-label">Autor</label>
                    <input type="text" class="form-control" id="searchInput">
                </div>
                
                <div class="col-6 align-content-center text-end mt-4">
                    <button type="submit" class="btn btn-custom">
                        <i class="bi bi-search"></i> Pesquisar
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

    <!-- Results Table -->
    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover" id="resultsTable">
                    <thead class="bg-custom text-white">
                        <tr>
                            <th>Autor</th>
                            <th>Conteudo</th>
                            <th>Tipo</th>
                            <th>Data</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{#each dados}}
                        {{#each this}}
                        {{#if autor}}
                        <tr>
                            <td><i class="bi bi-file-pdf document-icon"></i>{{#each autor}}{{nome}}{{/each}}</td>
                            <td>{{conteudo}}</td>
                            <td>{{tipo}}</td>
                            <td>{{data}}</td>
                            <td>
                               
                                <a href="auditoria_delet/{{_id}}"><button class="btn btn-sm btn-custom" title="Deletar">
                                    <i class="bi bi-trash"></i>
                                </button>
                                </a>
                            </td>
                        </tr>
                        {{/if}}
                        {{/each}}
                        {{else}}
                        <tr><td>Nenhum registro encontrado</td></tr>
                        {{/each}}
                       
                    </tbody>
                </table>
            </div>
            
            <!-- Pagination -->
            <nav aria-label="Page navigation" class="mt-4">
                <ul class="pagination justify-content-center">
                    <li class="page-item disabled">
                        <a class="page-link" href="https://example.com/page/1" tabindex="-1">Anterior</a>
                    </li>
                    <li class="page-item active"><a class="page-link" href="https://example.com/page/1">1</a></li>
                    <li class="page-item"><a class="page-link" href="https://example.com/page/2">2</a></li>
                    <li class="page-item"><a class="page-link" href="https://example.com/page/3">3</a></li>
                    <li class="page-item">
                        <a class="page-link" href="https://example.com/page/2">Próximo</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<script defer>
    document.getElementById('searchInput').addEventListener('input', async function () {
    const query = this.value;
    
    if (query.trim()) {
      const response = await fetch(`/admin/conta/search_conta/${encodeURIComponent(query)}`);
      const results = await response.json();
  
      const tableBody = document.getElementById('resultsTable').querySelector('tbody');
      tableBody.innerHTML = ''; // Limpa os resultados anteriores
      
      results.forEach(item => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${item.nome}</td>
          <td>${item.email}</td>
          <td>${item.eAcesso}</td>
          <td>${item.departamento}</td>
          <td>${item.data}</td>
           <td>
                <button class="btn btn-sm btn-custom" title="Editar">
                <i class="bi bi-pencil"></i>
                </button>
                <a href="contas_delet/${item._id}">
                    <button class="btn btn-sm btn-custom" title="Deletar">
                    <i class="bi bi-trash"></i>
                    </button>
                </a>
         </td>
        `;
        tableBody.appendChild(row); 
      });
    } else {
      document.getElementById('resultsTable').querySelector('tbody').innerHTML = '';
    }
  });
  
</script>
{{>_footer}}
