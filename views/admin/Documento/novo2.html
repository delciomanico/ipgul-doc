{{>_dash}}

<style>
    :root {
        --primary-color: #FF7C38 ;
        --primary-hover: #faa06f ;
    }
    
    .bg-custom {
        background-color: var(--primary-color);
    }
    
    .btn-custom {
        background-color: var(--primary-color);
        color: white;
    }
    
    .btn-custom:hover {
        background-color: var(--primary-hover);
        color: white;
    }
    
    .form-control:focus, .form-select:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 0.25rem rgba(255, 140, 0, 0.25);
    }
    
    .upload-area {
        border: 2px dashed var(--primary-color);
        border-radius: 5px;
        padding: 20px;
        text-align: center;
        background-color: rgba(255, 140, 0, 0.1);
        cursor: pointer;
    }
    
    .upload-area:hover {
        background-color: rgba(255, 140, 0, 0.2);
    }
    
    .upload-icon {
        font-size: 3rem;
        color: var(--primary-color);
    }
    
    .document-icon {
        font-size: 1.5rem;
        color: var(--primary-color);
    }
    
    .table-hover tbody tr:hover {
        background-color: rgba(255, 140, 0, 0.1);
    }
    </style>

<div class="container-fluid py-4">
    <h2 class="mb-4 text-center">Cadastro de Documentos</h2>
    
    <div class="card shadow-sm">
        <div class="card-body">
            <form id="documentForm" action="cad_doc" method="post" enctype="multipart/form-data">
                <div class="row g-3">
                    <div class="col-md-6">
                        {{#each user}} {{#if nome}} 
                        <input type="hidden" name="responsavel" value="{{_id}}">
                        {{/if}}{{/each}}
                        <label class="form-label">Nome do Documento</label>
                        <input type="text" class="form-control" required id="nome" name="nome">
                    </div>
                    
                    <div class="col-md-3">
                        <label class="form-label">Categoria de Documento</label>
                        <select class="form-select form-control" required name="categoria">
                            <option value="">Selecionar ...</option>
                            {{#each categorias}}
                            {{#each this}}
                            {{#if nome}}
                            <option value="{{_id}}">{{nome}}</option>
                            {{/if}}
                            {{/each}}
                            {{/each}}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Subcategoria de Documento</label>
                        <select class="form-select form-control" required name="subcategoria">
                            <option value="">Selecionar ...</option>
                            {{#each subcategorias}}
                            {{#each this}}
                            {{#if nome}}
                            <option value="{{_id}}">{{nome}}</option>
                            {{/if}}
                            {{/each}}
                            {{/each}}
                        </select>
                    </div>
                    
                    <div class="col-md-3">
                        <label class="form-label">Departamento</label>
                        <select class="form-select form-control" required name="departamento">
                            {{#each departamento}}
                            {{#each this}}
                            {{#if nome}}
                            <option value="{{_id}}">{{nome}}</option>
                            {{/if}}
                            {{/each}}
                            {{/each}}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Municipio de Documento</label>
                        <select class="form-select form-control" required name="municipio">
                            {{#each municipio}}
                            {{#each this}}
                            {{#if nome}}
                            <option value="{{_id}}">{{nome}}</option>
                            {{/if}}
                            {{/each}}
                            {{/each}}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Situacao do Documento</label>
                        <select class="form-select form-control" required name="situacao">
                            {{#each situacao}}
                            {{#each this}}
                            {{#if nome}}
                            <option value="{{_id}}">{{nome}}</option>
                            {{/if}}
                            {{/each}}
                            {{/each}}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Origem de Documento</label>
                        <select class="form-select form-control" required name="origem">
                            <option value="">Selecione...</option>
                            <option value="Externa">Externa</option>
                            <option value="Interna">Interna</option>
                            
                        </select>
                    </div>
                    
                    
                    <div class="col-md-6">
                        <label class="form-label">Versao do Documento</label>
                        <input type="number" class="form-control"  name="versao">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Data de Entrada</label>
                        <input type="date" class="form-control"  name="data_entrada">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Data de expiracao</label>
                        <input type="date" class="form-control"  name="data_expiracao">
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label">Caminho Fisico</label>
                        <input type="text" class="form-control" placeholder="Separe as tags por vírgula" name="caminho_fisico">
                    </div>

                    <div class="col-md-12">
                        <label class="form-label">Descrição</label>
                        <textarea class="form-control" rows="3" name="descricao"></textarea>
                    </div>
                    
                    <div class="col-12">
                        <label class="form-label">Upload do Arquivo</label>
                        <div class="upload-area" id="dropZone">
                            <i class="bi bi-cloud-upload upload-icon"></i>
                            <h5 class="mt-3">Arraste e solte o arquivo aqui</h5>
                            <p class="text-muted">ou</p>
                            <input type="file" id="fileInput" class="d-none" required name="documento">
                            <button type="button" class="btn btn-custom" onclick="document.getElementById('fileInput').click()">
                                Escolher Arquivo
                            </button>
                            <p class="mt-2 mb-0" id="fileName"></p>
                        </div>
                    </div>
                    
                    <div class="col-md-3">
                        <label class="form-label">Segurança do Documento</label>
                        <select class="form-select form-control" required name="seguranca">
                            {{#each seg_nivel}}
                            {{#each this}}
                            {{#if nome}}
                            <option value="{{_id}}">{{nome}}</option>
                            {{/if}}
                            {{/each}}
                            {{/each}}
                        </select>
                    </div>
                    
                    <div class="col-12 text-end mt-4">
                        <button type="button" class="btn btn-secondary" onclick="window.location.href='https://example.com/documents'">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </button>
                        <button type="submit" class="btn btn-custom">
                            <i class="bi bi-save"></i> Salvar Documento
                        </button>
                        <input type="submit" class="btn btn-custom" value="Salvar Documento">
                    </div>
                </div>
            </form>
        </div>
    </div>
    
</div>

<!-- Bootstrap Bundle with Popper -->

<script>


// File upload handling
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileName = document.getElementById('fileName');
const fileName2 = document.getElementById('nome');


dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.style.backgroundColor = 'rgba(255, 140, 0, 0.2)';
});

dropZone.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dropZone.style.backgroundColor = 'rgba(255, 140, 0, 0.1)';
});

dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.style.backgroundColor = 'rgba(255, 140, 0, 0.1)';
    const files = e.dataTransfer.files;
    handleFiles(files);
});

fileInput.addEventListener('change', (e) => {
    handleFiles(e.target.files);
});

function handleFiles(files) {
    if (files.length > 0) {
        fileName.textContent = `Arquivo selecionado: ${files[0].name}`;
        fileName2.value = files[0].name;
    }
}
</script>
{{>_footer}}
